<!DOCTYPE html><html lang="vi">
<head>
<meta charset="UTF-8">
<title>Vietlott AI PRO 29</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="icon.png"><style>

body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
background:linear-gradient(270deg,#0f2027,#203a43,#2c5364);
background-size:600% 600%;
animation:bg 20s infinite;
}

@keyframes bg{
0%{background-position:0%}
50%{background-position:100%}
100%{background-position:0%}
}

.ball{
width:55px;height:55px;
line-height:55px;
border-radius:50%;
display:inline-block;
margin:6px;
background:gold;
color:black;
font-weight:bold;
}

.power{background:red;color:white;}

button{
margin:4px;
padding:10px;
border-radius:20px;
border:none;
background:gold;
color:black;
}

.buttons{
position:fixed;
bottom:10px;
width:100%;
}

/* JACKPOT */

.bar{
height:14px;
width:30%;
background:green;
transition:0.5s;
}

.meter{
width:80%;
background:#333;
margin:auto;
border-radius:10px;
overflow:hidden;
}

#advice{margin-top:5px;font-weight:bold}

/* LED */

.led{
width:10px;height:10px;
background:#00ff00;
border-radius:50%;
display:inline-block;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:0.3}
}

/* FIRE */

.fire{
position:fixed;
bottom:0;
width:6px;height:6px;
background:orange;
border-radius:50%;
animation:rocket 1s forwards;
}

@keyframes rocket{
to{transform:translateY(-100vh)}
}

canvas{margin-top:10px}

</style></head><body><h2>🎰 Vietlott AI PRO 29</h2><div id="clock"></div><div><span class="led"></span> Đang kết nối Vietlott</div><div class="meter">
<div id="bar" class="bar"></div>
</div><div id="percent">30%</div>
<div id="advice"></div><h3 id="title">Kết quả</h3><div id="result"></div><canvas id="chart" width="320" height="120"></canvas>
<canvas id="wheel" width="200" height="200"></canvas>

<div id="heatmap"></div><button onclick="aiMega()">🤖 AI Mega</button>
<button onclick="aiPower()">🤖 AI Power</button>
<button onclick="aiJackpot()">💎 Jackpot AI</button>

<div class="buttons"><button onclick="mega()">Mega</button>
<button onclick="power()">Power</button>
<button onclick="bingo()">Bingo</button>
<button onclick="keno()">Keno</button>

<br><button onclick="lotto()">Lotto</button>
<button onclick="max3d()">Max3D</button>
<button onclick="max3dplus()">Max3D+</button>
<button onclick="max3dpro()">Max3D Pro</button>

</div><script>

/* CLOCK */

setInterval(()=>{
clock.innerText=new Date().toLocaleString()
},1000)

/* RANDOM */

function r(max){return Math.floor(Math.random()*max)+1}

function u(c,m){
let a=[]
while(a.length<c){
let n=r(m)
if(!a.includes(n)) a.push(n)
}
return a
}

/* DATA SIMULATION */

let history=[]

function generateHistory(){

for(let i=0;i<1000;i++){
history.push(u(6,45))
}

}

generateHistory()

/* HEATMAP */

function getHotNumbers(){

let count={}

history.forEach(draw=>{
draw.forEach(n=>{
count[n]=(count[n]||0)+1
})
})

let sorted=Object.entries(count).sort((a,b)=>b[1]-a[1])

return sorted.slice(0,6).map(x=>parseInt(x[0]))

}

/* AI */

function aiMega(){

let nums=getHotNumbers()

show(nums,0,"AI Mega (Hot)")

}

function aiPower(){

let nums=u(6,55)

show(nums,r(55),"AI Power")

}

/* JACKPOT */

let cycle=0

function jackpotAI(){

cycle++

let p=Math.min(95,cycle+Math.random()*20)

percent.innerText=Math.floor(p)+"%"

bar.style.width=p+"%"

if(p<40){
bar.style.background="green"
advice.innerText="🟢 Quan sát"
}
else if(p<70){
bar.style.background="orange"
advice.innerText="🟡 Cân nhắc"
}
else{
bar.style.background="red"
advice.innerText="🔴 Nên vào tiền"
}

return p

}

setInterval(jackpotAI,2000)

function aiJackpot(){

let nums=getHotNumbers()

let p=jackpotAI()

show(nums,0,"Jackpot AI "+Math.floor(p)+"%")

}

/* SHOW */

function show(nums,power,name){

title.innerText="🎰 "+name
result.innerHTML=""

nums.forEach(n=>{
let b=document.createElement("div")
b.className="ball"
b.innerText=n
result.appendChild(b)
})

if(power){
let p=document.createElement("div")
p.className="ball power"
p.innerText=power
result.appendChild(p)
}

effects()
drawChart()
drawWheel()
heat()

}

/* EFFECT */

function effects(){

for(let i=0;i<15;i++){
let f=document.createElement("div")
f.className="fire"
f.style.left=Math.random()*100+"%"
document.body.appendChild(f)
setTimeout(()=>f.remove(),1000)
}

let ctx=new (window.AudioContext||window.webkitAudioContext)()
let o=ctx.createOscillator()
let g=ctx.createGain()
o.connect(g);g.connect(ctx.destination)
o.start()
g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.5)

navigator.vibrate&&navigator.vibrate([200,100,200])

}

/* CHART */

function drawChart(){

let c=chart.getContext("2d")
chart.width=320

for(let i=0;i<20;i++){
c.fillStyle="cyan"
c.fillRect(i*15,120-Math.random()*100,10,100)
}

}

/* WHEEL */

function drawWheel(){

let c=wheel.getContext("2d")
c.clearRect(0,0,200,200)

for(let i=0;i<10;i++){
c.beginPath()
c.arc(100,100,80,0,Math.PI*2)
c.strokeStyle="gold"
c.stroke()
}

}

/* HEAT TEXT */

function heat(){

let h=getHotNumbers()

heatmap.innerText="🔥 Nóng: "+h.join(", ")

}

/* GAMES */

function mega(){show(u(6,45),0,"Mega")}
function power(){show(u(6,55),r(55),"Power")}
function bingo(){show(u(5,18),0,"Bingo")}
function keno(){show(u(10,80),0,"Keno")}
function lotto(){show(u(5,35),0,"Lotto")}
function max3d(){show([r(9),r(9),r(9)],0,"Max3D")}
function max3dplus(){show([r(9),r(9),r(9),r(9)],0,"Max3D+")}
function max3dpro(){show([r(9),r(9),r(9),r(9),r(9)],0,"Max3D Pro")}

</script></body>
</html>
